config:
  filename_format: "{{ created_year }}/{{ correspondent }}/{{ document_type }}-{{ title }}-{{ asn }}"
  url: "http://paperless.local"

webserver:
  image: ghcr.io/paperless-ngx/paperless-ngx:3.3.3@sha256:dba0242c1df1843643df4eb50ce5639f3a7900f414879088fd5bed8eaf2d456d
  secretKey:
    # This Secret must exist before deploying Paperless-ngx v3.
    name: paperless-secret-key
    key: PAPERLESS_SECRET_KEY
  socialAuth:
    enabled: false
    secretName: ""
    clientIdKey: client-id
    clientSecretKey: client-secret
    providerId: authentik
    providerName: ""
    serverUrl: ""
  disableRegularLogin: false
  replicaCount: 1
  strategyType: Recreate

  resources:
    limits:
      cpu: "2000m"
      memory: "4Gi"
    requests:
      cpu: "0"
      memory: "0"

  service:
    type: ClusterIP
    port: 8000

storage:
  emptyDir: {}
  # persistentVolumeClaim:
  #   name: paperless-smb-data

extraObjects:
  # - apiVersion: v1
  #   kind: PersistentVolumeClaim
  #   metadata:
  #     name: paperless-smb-data
  #   spec:
  #     accessModes:
  #       - ReadWriteMany
  #     resources:
  #       requests:
  #         storage: 1000Gi
  #     storageClassName: smb
  #     volumeMode: Filesystem
  #     volumeName: paperless-smb-data

ingress:
  enabled: false
  className: ""
  annotations: {}
  extraAnnotations: {}
  hosts:
    - host: paperless.local
  tls: []
  buffering:
    enabled: true
    middlewareName: upload-limit
    maxRequestBodyBytes: 104857600
    memRequestBodyBytes: 1048576
gateway:
  enabled: false
  name: edge
  namespace: envoy-gateway-system
  sectionName: ""
  # Set this to attach the Route to multiple Gateway listeners, for example
  # internal HTTPS and a Cloudflared HTTPS listener.
  parentRefs: []
  hostname: ""
  requestBuffer:
    enabled: true
    limit: 100Mi
  oidc:
    enabled: false
    secretName: ""
    providerIssuer: ""
    redirectURL: ""
    logoutPath: /logout
    scopes:
      - openid
      - email
      - profile

postgres:
  image: docker.io/library/postgres:17.6-alpine
  strategyType: Recreate
  persistentVolumeClaim:
    enabled: false
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "0"
      memory: "0"

broker:
  image: docker.io/library/redis:8.2-alpine
  strategyType: Recreate
  persistentVolumeClaim:
    enabled: false
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    storageClassName: ""
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "0"
      memory: "0"

gotenberg:
  image: docker.io/gotenberg/gotenberg:8
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "0"
      memory: "0"

tika:
  image: docker.io/apache/tika:3.2.2.0-full
  resources:
    limits:
      cpu: "1000m"
      memory: "2Gi"
    requests:
      cpu: "0"
      memory: "0"
