{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: webserver-gateway-https
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: webserver
spec:
  parentRefs:
    {{- if .Values.gateway.parentRefs }}
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
    {{- else }}
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.sectionName }}
    {{- end }}
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webserver
          port: {{ .Values.webserver.service.port }}
{{- if .Values.gateway.requestBuffer.enabled }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: webserver-upload-limit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: paperless-ngx
    app.kubernetes.io/component: webserver
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: webserver-gateway-https
  requestBuffer:
    limit: {{ .Values.gateway.requestBuffer.limit | quote }}
{{- end }}
{{- end }}
