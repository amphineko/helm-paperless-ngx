{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") .Values.ingress.httpRedirect.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ required "ingress.httpRedirect.middlewareName is required" .Values.ingress.httpRedirect.middlewareName | quote }}
  labels:
    app.kubernetes.io/component: webserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: paperless-ngx
spec:
  redirectScheme:
    scheme: https
    permanent: {{ .Values.ingress.httpRedirect.permanent }}
{{- end }}
