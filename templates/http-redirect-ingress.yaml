{{- if and .Values.ingress.enabled (eq .Values.ingress.className "traefik") .Values.ingress.httpRedirect.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "webserver-http-redirect"
  labels:
    app.kubernetes.io/component: webserver
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: paperless-ngx
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace .Values.ingress.httpRedirect.middlewareName | quote }}
    external-dns.kubernetes.io/ingress-hostname-source: annotation-only
spec:
  ingressClassName: traefik
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webserver
                port:
                  number: {{ $.Values.webserver.service.port }}
    {{- end }}
{{- end }}
